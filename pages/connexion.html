<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Connexion — Vingade+</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><header class="auth-top"><a class="brand" href="/">Vingade<span>+</span></a></header><main class="form-layout"><section class="panel"><span class="kicker">BON RETOUR</span><h1>Content de te revoir.</h1><p class="intro">Connecte-toi pour retrouver tes favoris et ton espace.</p><div class="form-message error" id="form-message" hidden></div><form data-auth="signin"><label class="field"><span>Adresse e-mail</span><input name="email" type="email" required autocomplete="email" placeholder="toi@exemple.com"></label><label class="field"><span>Mot de passe</span><input name="password" type="password" minlength="6" required autocomplete="current-password" placeholder="Ton mot de passe"></label><button class="btn btn-primary" type="submit" style="width:100%">Se connecter</button></form><p class="form-foot">Pas encore de compte ? <a href="/pages/inscription.html">Créer un compte</a></p><p class="safe-note">La connexion utilise Supabase Auth. N'envoie jamais ton mot de passe à quelqu'un.</p></section></main><script type="module" src="/js/auth-page.js"></script></body></html>
