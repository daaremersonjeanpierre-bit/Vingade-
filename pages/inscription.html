<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Créer un compte — Vingade+</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><header class="auth-top"><a class="brand" href="/">Vingade<span>+</span></a></header><main class="form-layout"><section class="panel"><span class="kicker">REJOINS L'UNIVERS</span><h1>Crée ton compte.</h1><p class="intro">Un compte pour gérer tes favoris, commenter et noter les œuvres.</p><div class="form-message error" id="form-message" hidden></div><form data-auth="signup"><label class="field"><span>Nom affiché</span><input name="display_name" maxlength="80" required autocomplete="name" placeholder="Ton nom public"></label><label class="field"><span>Adresse e-mail</span><input name="email" type="email" required autocomplete="email" placeholder="toi@exemple.com"></label><label class="field"><span>Mot de passe</span><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="8 caractères minimum"></label><button class="btn btn-primary" type="submit" style="width:100%">Créer mon compte</button></form><p class="form-foot">Déjà inscrit ? <a href="/pages/connexion.html">Se connecter</a></p><p class="safe-note">La création d'un compte créateur se fait sur demande et nécessite l'approbation de l'administration.</p></section></main><script type="module" src="/js/auth-page.js"></script></body></html>
