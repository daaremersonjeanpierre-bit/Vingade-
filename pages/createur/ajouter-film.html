<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajouter une œuvre — Vingade+ Créateur</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body data-view="add"><header class="topbar"><a class="brand" href="/">Vingade<span>+</span></a><div class="top-actions"><span class="status approved">ESPACE CRÉATEUR</span></div></header><main class="page-wrap"><div class="page-title"><div><span class="kicker">CRÉER · PARTAGER · GRANDIR</span><h1>Ajouter une œuvre</h1><p>Soumets un film ou une série pour validation</p></div><a class="btn btn-ghost" href="/">↗ Voir le site</a></div><div class="dashboard-layout"><aside class="panel side-menu" id="creator-sidebar"></aside><div id="creator-content"><section class="panel"><h2 id="form-title">Nouvelle œuvre</h2><p class="muted">Ajoute uniquement des œuvres dont tu possèdes les droits ou une autorisation de diffusion.</p><form id="movie-form"><div class="inline-form"><label class="field"><span>Titre *</span><input name="title" maxlength="160" required></label><label class="field"><span>Catégorie *</span><select name="category" required><option value="Action">Action</option><option value="Drame">Drame</option><option value="Comédie">Comédie</option><option value="Documentaire">Documentaire</option><option value="Animation">Animation</option><option value="Série">Série</option><option value="Autre">Autre</option></select></label><label class="field"><span>Année de sortie</span><input type="number" name="release_year" min="1888" max="2100" placeholder="2026"></label><label class="field"><span>Durée (minutes)</span><input type="number" name="duration_minutes" min="1" max="1000" placeholder="110"></label><label class="field full"><span>Synopsis *</span><textarea name="description" maxlength="5000" required placeholder="Présente l'histoire, sans divulguer ce que tu souhaites garder secret…"></textarea></label><label class="field full"><span>URL de l'affiche (https://)</span><input type="url" name="poster_url" placeholder="https://..."><small>Utilise une image dont tu as le droit d'usage.</small></label><label class="field full"><span>URL de lecture vidéo (https://)</span><input type="url" name="video_url" placeholder="URL de lecture fournie par ton hébergeur vidéo"><small>Pour une vraie diffusion, utilise un service vidéo configuré et une URL de lecture autorisée. Ne colle pas une clé secrète dans cette URL.</small></label><label class="field full"><span><input type="checkbox" name="rights_confirmed" required style="width:auto;margin-right:8px">Je confirme posséder les droits nécessaires ou l’autorisation écrite pour diffuser cette œuvre sur Vingade+.</span></label></div><div class="form-actions"><button type="submit" class="btn btn-primary">Soumettre pour validation</button><a href="/pages/createur/mes-films.html" class="btn btn-ghost">Annuler</a></div></form></section><div id="creator-extra"></div></div></div></main><script type="module" src="/js/creator.js"></script></body></html>
